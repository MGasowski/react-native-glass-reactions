appId: glassreactions.example
name: Reactions example — launch and scroll arbitration
---
# Scope note, so nobody mistakes this for coverage of the core interaction.
#
# Maestro cannot express press → hold → drag → release as one continuous
# gesture: `longPressOn` presses *and releases*, which ends the interaction
# before a reaction can be dragged to. The selection path is covered by the
# XCUITest suite in example/ios/GlassReactionsExampleUITests instead.
#
# What this flow protects is the arbitration rule spec §6.4 calls the top
# support cost: an ordinary swipe must scroll the list and must NOT open the
# picker, with the host's recognizer installed.

- launchApp:
    clearState: true

# A debug build fetches and evaluates the JS bundle first, which is far slower
# than the default assertion timeout. Row #1 is deliberately not asserted on:
# it sits under the status bar and is filtered out of the hierarchy.
- extendedWaitUntil:
    visible: 'Review #5'
    timeout: 120000

- assertVisible: 'Review #6'

# --- Swiping scrolls -------------------------------------------------------
# scrollUntilVisible rather than a fixed swipe plus a fixed expectation: CI
# runs with animations disabled, so a swipe carries no fling momentum and
# covers far fewer rows than the same gesture on a developer machine. Asserting
# a specific row after one swipe is a test of the runner's physics, not of this
# library.
- scrollUntilVisible:
    element:
      text: 'Review #15'
    direction: DOWN
    timeout: 30000

# --- ...and scrolling must never open the picker ---------------------------
# Reactions are only in the hierarchy while the picker is open, so their
# absence is the assertion that arbitration held.
- assertNotVisible: 'Like'
- assertNotVisible: 'Fire'

# --- And scrolls back ------------------------------------------------------
- scrollUntilVisible:
    element:
      text: 'Review #5'
    direction: UP
    timeout: 30000
